<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Profile - Speedy</title>
    <link rel="stylesheet" href="driver.css">
</head>
<body>
    <div class="container">
        <h1>Driver Profile</h1>
        <div id="profileDetails">
            <p><strong>Driver Name:</strong> <span id="profileName"></span></p>
            <p><strong>Phone Number:</strong> <span id="profilePhone"></span></p>
            <p><strong>Ambulance Number:</strong> <span id="profileAmbulance"></span></p>
            <p><strong>Uploaded Photo:</strong> <span id="profilePhoto"></span></p> <!-- Display the file name here -->
            <p><strong>Driving License:</strong> <a id="profileLicense" href="#" target="_blank">View License</a></p> 
            <a href="drivermap.html"><button id="startRideButton">Start Ride</button></a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
