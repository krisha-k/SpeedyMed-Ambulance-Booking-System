<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Display</title>
    <link rel="stylesheet" href="yes.css">
</head>
<body>

<div class="container">
    <div class="message-box">
        <p>Have a safe journey!</p>
        <button id="otpButton" onclick="showOTP()">Press to get OTP</button>
        <p id="otpNumber" class="hidden">4621</p>
    </div>
</div>

<script>
    function showOTP() {
        document.getElementById("otpNumber").classList.remove("hidden");
    }
</script>

</body>
</html>
